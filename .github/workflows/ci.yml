name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            examples/sceyt-livechat-demo/yarn.lock

      # --ignore-scripts skips the root "prepare" (= build) so a build failure
      # shows up in its own step below. The only other install scripts are
      # core-js donation banners.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      # Tests resolve react / react-dom from the demo app (see NODE_PATH in
      # the test scripts), so its dependencies must be installed too.
      - name: Install demo dependencies (react, react-dom for tests)
        working-directory: examples/sceyt-livechat-demo
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: yarn test:lint

      - name: Unit tests with coverage thresholds
        run: yarn test:coverage

      - name: Build
        run: yarn build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # One check for branch protection: fails if any job above did not pass.
  all-checks:
    name: All checks
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "One or more checks did not pass: $RESULTS"
              exit 1
            fi
          done
          echo "All checks passed."

  # Posts the result to the team's Waafi channel (see channel-alerts.yml).
  # Skipped for cancelled runs, fork pull requests and Dependabot (they
  # cannot read the secret).
  waafi-alerts:
    name: Waafi Alerts
    needs: [test, all-checks]
    if: >-
      always() && !cancelled() && github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/channel-alerts.yml
    with:
      project: Chat React UIKit
      channel-id: '869431927627001856'
      failed: ${{ contains(needs.*.result, 'failure') }}
    secrets:
      WAAFI_PLATFORM_API_KEY: ${{ secrets.WAAFI_PLATFORM_API_KEY }}
