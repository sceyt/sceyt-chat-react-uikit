name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full CodeQL scan (Mondays 06:17 UTC) to catch newly published query rules.
    - cron: '17 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload results to the Security tab
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - dist
              - coverage
              - examples
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - src/testUtils

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # post a summary comment when it fails
    steps:
      - uses: actions/checkout@v4

      # Fails the PR if it ADDS a dependency with a known high/critical
      # vulnerability or a copyleft license. Existing issues are handled by Dependabot.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure

  secrets:
    name: Secret scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans only the commits in this push / PR. Fails on verified or
      # possibly-valid secrets (API keys, tokens, passwords...).
      - uses: trufflesecurity/trufflehog@v3.98.1
        with:
          extra_args: --results=verified,unknown
